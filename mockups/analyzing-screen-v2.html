<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyzing Screen — Option B: Sound Wave Morphing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0A0E1A;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Inter', sans-serif;
    overflow: hidden;
  }

  .phone {
    width: 393px;
    height: 852px;
    background: #0A0E1A;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    border: 2px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Background particles */
  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(0,163,255,0.3);
    animation: float-up linear infinite;
  }

  .particle:nth-child(1) { left: 15%; animation-duration: 6s; animation-delay: 0s; }
  .particle:nth-child(2) { left: 30%; animation-duration: 8s; animation-delay: 1s; width: 3px; height: 3px; background: rgba(6,214,160,0.25); }
  .particle:nth-child(3) { left: 50%; animation-duration: 7s; animation-delay: 2s; }
  .particle:nth-child(4) { left: 70%; animation-duration: 9s; animation-delay: 0.5s; width: 3px; height: 3px; background: rgba(139,92,246,0.2); }
  .particle:nth-child(5) { left: 85%; animation-duration: 6.5s; animation-delay: 3s; }
  .particle:nth-child(6) { left: 40%; animation-duration: 7.5s; animation-delay: 1.5s; background: rgba(6,214,160,0.2); }
  .particle:nth-child(7) { left: 60%; animation-duration: 8.5s; animation-delay: 4s; }
  .particle:nth-child(8) { left: 25%; animation-duration: 5.5s; animation-delay: 2.5s; background: rgba(139,92,246,0.25); }

  @keyframes float-up {
    0% { bottom: -10px; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { bottom: 100%; opacity: 0; }
  }

  /* Sound wave visualization - the hero */
  .wave-hero {
    position: relative;
    width: 320px;
    height: 140px;
    margin-bottom: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }

  .wave-bar {
    width: 4px;
    border-radius: 4px;
    animation: wave-bounce ease-in-out infinite;
    position: relative;
  }

  /* Individual bar colors + timing */
  .wave-bar:nth-child(1)  { height: 16px; animation-duration: 1.2s; animation-delay: 0.00s; background: linear-gradient(180deg, #0036FF 0%, rgba(0,54,255,0.2) 100%); }
  .wave-bar:nth-child(2)  { height: 24px; animation-duration: 1.0s; animation-delay: 0.05s; background: linear-gradient(180deg, #0048FF 0%, rgba(0,72,255,0.2) 100%); }
  .wave-bar:nth-child(3)  { height: 40px; animation-duration: 1.3s; animation-delay: 0.10s; background: linear-gradient(180deg, #005AFF 0%, rgba(0,90,255,0.2) 100%); }
  .wave-bar:nth-child(4)  { height: 56px; animation-duration: 0.9s; animation-delay: 0.15s; background: linear-gradient(180deg, #006CFF 0%, rgba(0,108,255,0.2) 100%); }
  .wave-bar:nth-child(5)  { height: 72px; animation-duration: 1.1s; animation-delay: 0.20s; background: linear-gradient(180deg, #007EFF 0%, rgba(0,126,255,0.2) 100%); }
  .wave-bar:nth-child(6)  { height: 88px; animation-duration: 1.4s; animation-delay: 0.25s; background: linear-gradient(180deg, #0090FF 0%, rgba(0,144,255,0.2) 100%); }
  .wave-bar:nth-child(7)  { height: 100px; animation-duration: 1.0s; animation-delay: 0.30s; background: linear-gradient(180deg, #00A3FF 0%, rgba(0,163,255,0.2) 100%); }
  .wave-bar:nth-child(8)  { height: 110px; animation-duration: 1.2s; animation-delay: 0.35s; background: linear-gradient(180deg, #00B0FF 0%, rgba(0,176,255,0.15) 100%); }
  .wave-bar:nth-child(9)  { height: 120px; animation-duration: 0.8s; animation-delay: 0.40s; background: linear-gradient(180deg, #06D6A0 0%, rgba(6,214,160,0.15) 100%); box-shadow: 0 0 12px rgba(6,214,160,0.2); }
  .wave-bar:nth-child(10) { height: 130px; animation-duration: 1.3s; animation-delay: 0.45s; background: linear-gradient(180deg, #04C490 0%, rgba(4,196,144,0.15) 100%); box-shadow: 0 0 14px rgba(6,214,160,0.25); }
  .wave-bar:nth-child(11) { height: 130px; animation-duration: 1.1s; animation-delay: 0.50s; background: linear-gradient(180deg, #06D6A0 0%, rgba(6,214,160,0.15) 100%); box-shadow: 0 0 14px rgba(6,214,160,0.25); }
  .wave-bar:nth-child(12) { height: 120px; animation-duration: 0.9s; animation-delay: 0.55s; background: linear-gradient(180deg, #00B0FF 0%, rgba(0,176,255,0.15) 100%); }
  .wave-bar:nth-child(13) { height: 110px; animation-duration: 1.2s; animation-delay: 0.60s; background: linear-gradient(180deg, #00A3FF 0%, rgba(0,163,255,0.2) 100%); }
  .wave-bar:nth-child(14) { height: 100px; animation-duration: 1.4s; animation-delay: 0.65s; background: linear-gradient(180deg, #0090FF 0%, rgba(0,144,255,0.2) 100%); }
  .wave-bar:nth-child(15) { height: 88px; animation-duration: 1.0s; animation-delay: 0.70s; background: linear-gradient(180deg, #007EFF 0%, rgba(0,126,255,0.2) 100%); }
  .wave-bar:nth-child(16) { height: 72px; animation-duration: 1.3s; animation-delay: 0.75s; background: linear-gradient(180deg, #006CFF 0%, rgba(0,108,255,0.2) 100%); }
  .wave-bar:nth-child(17) { height: 56px; animation-duration: 0.9s; animation-delay: 0.80s; background: linear-gradient(180deg, #005AFF 0%, rgba(0,90,255,0.2) 100%); }
  .wave-bar:nth-child(18) { height: 40px; animation-duration: 1.1s; animation-delay: 0.85s; background: linear-gradient(180deg, #0048FF 0%, rgba(0,72,255,0.2) 100%); }
  .wave-bar:nth-child(19) { height: 24px; animation-duration: 1.2s; animation-delay: 0.90s; background: linear-gradient(180deg, #0036FF 0%, rgba(0,54,255,0.2) 100%); }
  .wave-bar:nth-child(20) { height: 16px; animation-duration: 1.0s; animation-delay: 0.95s; background: linear-gradient(180deg, #0036FF 0%, rgba(0,54,255,0.2) 100%); }

  @keyframes wave-bounce {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }

  /* Glow reflection under waveform */
  .wave-glow {
    position: absolute;
    bottom: -20px;
    width: 200px;
    height: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,163,255,0.15) 0%, transparent 70%);
    filter: blur(10px);
  }

  /* Stage chip */
  .stage-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,163,255,0.08);
    border: 1px solid rgba(0,163,255,0.15);
    border-radius: 20px;
    padding: 8px 16px;
    margin-bottom: 16px;
  }

  .stage-chip-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00A3FF;
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .stage-chip-text {
    font-size: 13px;
    font-weight: 600;
    color: #00A3FF;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  /* Text section */
  .text-section {
    text-align: center;
    margin-bottom: 48px;
    position: relative;
    z-index: 2;
  }

  .main-title {
    font-size: 26px;
    font-weight: 700;
    color: #F9FAFB;
    margin-bottom: 8px;
    letter-spacing: -0.4px;
  }

  .main-subtitle {
    font-size: 15px;
    color: #9CA3AF;
    line-height: 1.5;
    max-width: 280px;
    margin: 0 auto;
  }

  /* Progress bar — arc style at bottom */
  .progress-arc {
    width: 300px;
    position: relative;
    z-index: 2;
  }

  .arc-track {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .arc-fill {
    height: 100%;
    width: 26%;
    border-radius: 2px;
    background: linear-gradient(90deg, #0036FF, #00A3FF, #06D6A0);
    background-size: 200% 100%;
    animation: gradient-shift 3s ease infinite;
    position: relative;
    transition: width 0.8s ease;
  }

  .arc-fill::after {
    content: '';
    position: absolute;
    right: 0;
    top: -3px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #06D6A0;
    box-shadow: 0 0 10px rgba(6,214,160,0.6);
  }

  @keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
  }

  .progress-steps {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .p-step {
    width: 24px;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    transition: all 0.3s;
  }

  .p-step.active {
    background: #00A3FF;
    width: 32px;
  }

  .p-step.done {
    background: #10B981;
  }

  .progress-pct {
    font-size: 13px;
    font-weight: 600;
    color: #D1D5DB;
    font-variant-numeric: tabular-nums;
  }

  /* Encouragement */
  .encouragement {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 300px;
  }

  .encouragement-text {
    font-size: 13px;
    color: #6B7280;
    line-height: 1.5;
  }

  /* Label */
  .option-label {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 5;
    white-space: nowrap;
  }

  /* Hover state simulates progress */
  .phone:hover .arc-fill {
    width: 65%;
  }
</style>
</head>
<body>

<div class="phone">
  <span class="option-label">Option B — Sound Wave</span>

  <!-- Background particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Sound wave visualization -->
  <div class="wave-hero">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-glow"></div>
  </div>

  <!-- Stage chip -->
  <div class="stage-chip">
    <div class="stage-chip-dot"></div>
    <span class="stage-chip-text">Transcribing</span>
  </div>

  <!-- Text -->
  <div class="text-section">
    <div class="main-title">Analyzing your reading</div>
    <div class="main-subtitle">We're processing your pronunciation to give you personalized feedback</div>
  </div>

  <!-- Progress -->
  <div class="progress-arc">
    <div class="arc-track">
      <div class="arc-fill"></div>
    </div>
    <div class="progress-info">
      <div class="progress-steps">
        <div class="p-step active"></div>
        <div class="p-step"></div>
      </div>
      <span class="progress-pct">26%</span>
    </div>
  </div>

  <!-- Bottom encouragement -->
  <div class="encouragement">
    <p class="encouragement-text">This takes a few seconds. Your detailed feedback is being prepared.</p>
  </div>
</div>

</body>
</html>

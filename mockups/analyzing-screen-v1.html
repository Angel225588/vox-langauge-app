<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyzing Screen — Option A: Orbital Rings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0A0E1A;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Inter', sans-serif;
    overflow: hidden;
  }

  .phone {
    width: 393px;
    height: 852px;
    background: #0A0E1A;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    border: 2px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Subtle ambient glow behind the orb */
  .ambient-glow {
    position: absolute;
    width: 300px;
    height: 300px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,54,255,0.12) 0%, rgba(0,163,255,0.06) 40%, transparent 70%);
    filter: blur(40px);
    pointer-events: none;
  }

  /* Central orb container */
  .orb-container {
    position: relative;
    width: 180px;
    height: 180px;
    margin-bottom: 48px;
  }

  /* Rotating ring 1 — outer */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid transparent;
  }

  .ring-1 {
    width: 180px;
    height: 180px;
    top: 0; left: 0;
    border-color: rgba(0,163,255,0.25);
    border-top-color: #00A3FF;
    border-right-color: rgba(0,163,255,0.08);
    animation: spin 3s linear infinite;
  }

  .ring-2 {
    width: 148px;
    height: 148px;
    top: 16px; left: 16px;
    border-color: rgba(6,214,160,0.2);
    border-bottom-color: #06D6A0;
    border-left-color: rgba(6,214,160,0.06);
    animation: spin-reverse 2.5s linear infinite;
  }

  .ring-3 {
    width: 116px;
    height: 116px;
    top: 32px; left: 32px;
    border-color: rgba(139,92,246,0.2);
    border-top-color: #8B5CF6;
    animation: spin 2s linear infinite;
  }

  /* Center core */
  .core {
    position: absolute;
    width: 72px;
    height: 72px;
    top: 54px; left: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0036FF 0%, #00A3FF 100%);
    box-shadow: 0 0 30px rgba(0,54,255,0.4), 0 0 60px rgba(0,163,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: core-pulse 2s ease-in-out infinite;
  }

  .core svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: white;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Floating dots on the rings */
  .dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: dot-pulse 1.5s ease-in-out infinite;
  }

  .dot-1 {
    top: -3px; left: 87px;
    background: #00A3FF;
    box-shadow: 0 0 8px #00A3FF;
    animation-delay: 0s;
  }
  .dot-2 {
    bottom: 13px; right: 20px;
    background: #06D6A0;
    box-shadow: 0 0 8px #06D6A0;
    animation-delay: 0.5s;
  }
  .dot-3 {
    top: 30px; left: 34px;
    background: #8B5CF6;
    box-shadow: 0 0 8px #8B5CF6;
    animation-delay: 1s;
  }

  /* Stage info */
  .stage-info {
    text-align: center;
    margin-bottom: 40px;
    position: relative;
    z-index: 2;
  }

  .stage-title {
    font-size: 24px;
    font-weight: 700;
    color: #F9FAFB;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }

  .stage-subtitle {
    font-size: 15px;
    color: #9CA3AF;
    font-weight: 400;
  }

  /* Progress section */
  .progress-section {
    width: 280px;
    position: relative;
    z-index: 2;
    margin-bottom: 32px;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #0036FF, #00A3FF);
    border-radius: 3px;
    width: 26%;
    transition: width 0.8s ease;
    box-shadow: 0 0 12px rgba(0,163,255,0.3);
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .progress-stage {
    font-size: 12px;
    font-weight: 600;
    color: #00A3FF;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .progress-pct {
    font-size: 14px;
    font-weight: 600;
    color: #D1D5DB;
    font-variant-numeric: tabular-nums;
  }

  /* Steps indicator */
  .steps {
    display: flex;
    gap: 16px;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.35;
    transition: opacity 0.3s;
  }

  .step.active {
    opacity: 1;
  }

  .step.done {
    opacity: 0.7;
  }

  .step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #374151;
    transition: all 0.3s;
  }

  .step.active .step-dot {
    background: #00A3FF;
    box-shadow: 0 0 8px rgba(0,163,255,0.5);
  }

  .step.done .step-dot {
    background: #10B981;
  }

  .step-text {
    font-size: 12px;
    color: #9CA3AF;
    font-weight: 500;
  }

  .step.active .step-text {
    color: #F9FAFB;
  }

  /* Connector lines between steps */
  .step-line {
    width: 20px;
    height: 1px;
    background: #374151;
  }

  /* Keyframes */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes spin-reverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  @keyframes core-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0,54,255,0.4), 0 0 60px rgba(0,163,255,0.15); }
    50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(0,54,255,0.5), 0 0 80px rgba(0,163,255,0.2); }
  }

  @keyframes dot-pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Label */
  .option-label {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 5;
  }

  /* Simulate stage transition */
  .phone:hover .progress-fill {
    width: 65%;
  }
  .phone:hover .progress-stage {
    color: #8B5CF6;
  }
  .phone:hover .stage-title::after {
    content: '';
  }
</style>
</head>
<body>

<div class="phone">
  <span class="option-label">Option A — Orbital Rings</span>

  <div class="ambient-glow"></div>

  <!-- Orbital Rings Animation -->
  <div class="orb-container">
    <div class="ring ring-1">
      <div class="dot dot-1"></div>
    </div>
    <div class="ring ring-2">
      <div class="dot dot-2"></div>
    </div>
    <div class="ring ring-3">
      <div class="dot dot-3"></div>
    </div>
    <div class="core">
      <!-- Waveform icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 3v18M8 7v10M4 10v4M16 7v10M20 10v4"/>
      </svg>
    </div>
  </div>

  <!-- Stage info -->
  <div class="stage-info">
    <div class="stage-title">Transcribing speech...</div>
    <div class="stage-subtitle">Converting your voice to text</div>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-label">
      <span class="progress-stage">Step 1 of 2</span>
      <span class="progress-pct">26%</span>
    </div>
  </div>

  <!-- Steps indicator -->
  <div class="steps">
    <div class="step active">
      <div class="step-dot"></div>
      <span class="step-text">Transcribe</span>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-dot"></div>
      <span class="step-text">Analyze</span>
    </div>
  </div>
</div>

</body>
</html>
